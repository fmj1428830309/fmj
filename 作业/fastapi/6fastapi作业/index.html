<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>用户管理 - FastAPI CRUD</title>

  <!-- CDN 引入：Vue3 + ElementPlus + axios -->
  <link rel="stylesheet" href="https://unpkg.com/element-plus@2.7.8/dist/index.css" />
  <script src="https://unpkg.com/vue@3.4.38/dist/vue.global.prod.js"></script>
  <script src="https://unpkg.com/element-plus@2.7.8/dist/index.full.js"></script>
  <script src="https://unpkg.com/element-plus@2.7.8/dist/locale/zh-cn.js"></script>
  <script src="https://unpkg.com/axios@1.7.7/dist/axios.min.js"></script>

  <style>
    body { margin: 0; background: #f5f7fa; font-family: "Microsoft YaHei", sans-serif; }
    #app { padding: 24px; max-width: 1080px; margin: 0 auto; }
    .page-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; }
    .page-title { font-size: 20px; font-weight: 600; color: #303133; }
    .toolbar { display: flex; gap: 10px; align-items: center; }
    .card-wrap { background: #fff; border-radius: 8px; padding: 16px; box-shadow: 0 1px 4px rgba(0,0,0,.06); }
    .empty-tip { color: #909399; text-align: center; padding: 30px 0; }
  </style>
</head>
<body>
  <div id="app">
    <el-card shadow="never" class="card-wrap">
      <div class="page-header">
        <span class="page-title">用户管理</span>
        <div class="toolbar">
          <!-- 搜索：走后端 /user/by-name/{name} 模糊查询 -->
          <!-- 自定义组件绝对不能写成 <xxx /> 自闭合：浏览器不认识它，会把后面的兄弟标签全吞成子节点 -->
          <el-input
            v-model="keyword"
            placeholder="按姓名模糊搜索"
            clearable
            style="width: 220px"
            @keyup.enter="handleSearch"
            @clear="handleSearch"
          ></el-input>
          <el-button type="primary" @click="handleSearch">搜索</el-button>
          <el-button @click="handleReset">重置</el-button>
          <el-button type="success" @click="openCreate">新增用户</el-button>
        </div>
      </div>

      <el-table :data="users" v-loading="loading" border stripe style="width: 100%">
        <el-table-column prop="id" label="编号" width="80" ></el-table-column>
        <el-table-column prop="name" label="姓名" width="120" ></el-table-column>
        <el-table-column prop="age" label="年龄" width="90" ></el-table-column>
        <el-table-column prop="sex" label="性别" width="90">
          <template #default="{ row }">
            <el-tag :type="row.sex === '男' ? 'primary' : 'danger'" effect="plain">{{ row.sex || '-' }}</el-tag>
          </template>
        </el-table-column>
        <el-table-column prop="telephone" label="手机号" width="150" ></el-table-column>
        <el-table-column prop="email" label="邮箱" min-width="180" ></el-table-column>
        <el-table-column label="操作" width="150" fixed="right">
          <template #default="{ row }">
            <el-button size="small" type="primary" link @click="openEdit(row)">编辑</el-button>
            <el-button size="small" type="danger" link @click="handleDelete(row)">删除</el-button>
          </template>
        </el-table-column>
        <template #empty>
          <div class="empty-tip">暂无数据，点右上角「新增用户」添加一条</div>
        </template>
      </el-table>
    </el-card>

    <!-- 新增 / 编辑 对话框 -->
    <el-dialog v-model="dialogVisible" :title="isEdit ? '编辑用户' : '新增用户'" width="440px" @closed="resetForm">
      <el-form ref="formRef" :model="form" :rules="rules" label-width="80px">
        <el-form-item label="姓名" prop="name">
          <el-input v-model="form.name" placeholder="2~20 个中文字符"></el-input>
        </el-form-item>
        <el-form-item label="年龄" prop="age">
          <el-input-number v-model="form.age" :min="0" :max="150" controls-position="right" style="width: 100%"></el-input-number>
        </el-form-item>
        <el-form-item label="性别" prop="sex">
          <el-radio-group v-model="form.sex">
            <el-radio value="男">男</el-radio>
            <el-radio value="女">女</el-radio>
          </el-radio-group>
        </el-form-item>
        <el-form-item label="手机号" prop="telephone">
          <el-input v-model="form.telephone" maxlength="11" placeholder="11 位大陆手机号"></el-input>
        </el-form-item>
        <el-form-item label="邮箱" prop="email">
          <el-input v-model="form.email" placeholder="name@example.com"></el-input>
        </el-form-item>
      </el-form>
      <template #footer>
        <el-button @click="dialogVisible = false">取 消</el-button>
        <el-button type="primary" :loading="submitting" @click="handleSubmit">确 定</el-button>
      </template>
    </el-dialog>
  </div>

  <script>
    const { createApp, ref, reactive, onMounted } = Vue;
    const { ElMessage, ElMessageBox } = ElementPlus;

    // file:// 直接双击打开时同源策略不生效，必须写死后台地址；
    // 通过 uvicorn 访问 http://127.0.0.1:8000/ 时用相对路径即可。
    const API_BASE = location.protocol === 'file:' ? 'http://127.0.0.1:8000' : '';

    // 前端先拦一道，规则跟后端保持一致
    const NAME_RE = /^[\u4e00-\u9fa5·]{2,20}$/;
    const PHONE_RE = /^1[3-9]\d{9}$/;
    const EMAIL_RE = /^[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}$/;

    createApp({
      setup() {
        const users = ref([]);
        const keyword = ref('');
        const loading = ref(false);
        const submitting = ref(false);
        const dialogVisible = ref(false);
        const isEdit = ref(false);
        const formRef = ref(null);
        const currentId = ref(null);

        const emptyForm = () => ({
          name: '', age: 18, sex: '男', telephone: '', email: ''
        });
        const form = reactive(emptyForm());

        const rules = {
          name: [
            { required: true, message: '请输入姓名', trigger: 'blur' },
            { pattern: NAME_RE, message: '2~20 个中文字符', trigger: 'blur' }
          ],
          age: [{ required: true, message: '请输入年龄', trigger: 'blur' }],
          sex: [{ required: true, message: '请选择性别', trigger: 'change' }],
          telephone: [
            { required: true, message: '请输入手机号', trigger: 'blur' },
            { pattern: PHONE_RE, message: '手机号格式不正确', trigger: 'blur' }
          ],
          email: [
            { required: true, message: '请输入邮箱', trigger: 'blur' },
            { pattern: EMAIL_RE, message: '邮箱格式不正确', trigger: 'blur' }
          ]
        };

        /**
         * 后台统一返回 {code, msg, data}：
         * code 是 200/201 才算成功，其余一律把 msg 弹出来。
         */
        function unwrap(res, successMsg) {
          const code = res.data.code;
          if (code === 200 || code === 201) {
            if (successMsg) ElMessage.success(successMsg);
            return res.data.data;
          }
          ElMessage.error(res.data.msg || '操作失败');
          return null;
        }

        async function loadUsers() {
          loading.value = true;
          try {
            let res;
            if (keyword.value && keyword.value.trim()) {
              // 按名称模糊查询
              res = await axios.get(`${API_BASE}/user/by-name/${encodeURIComponent(keyword.value.trim())}`);
            } else {
              res = await axios.get(`${API_BASE}/user`);
            }
            users.value = unwrap(res) || [];
          } catch (e) {
            console.error(e);
            ElMessage.error(e.response?.data?.msg || '请求后台失败，确认服务是否已启动');
            users.value = [];
          } finally {
            loading.value = false;
          }
        }

        function handleSearch() { loadUsers(); }
        function handleReset() { keyword.value = ''; loadUsers(); }

        function resetForm() {
          Object.assign(form, emptyForm());
          currentId.value = null;
          formRef.value?.clearValidate();
        }

        function openCreate() {
          isEdit.value = false;
          resetForm();
          dialogVisible.value = true;
        }

        function openEdit(row) {
          isEdit.value = true;
          resetForm();
          currentId.value = row.id;
          Object.assign(form, {
            name: row.name,
            age: row.age,
            sex: row.sex,
            telephone: row.telephone,
            email: row.email
          });
          dialogVisible.value = true;
        }

        async function handleSubmit() {
          if (!formRef.value) return;
          await formRef.value.validate(async (valid) => {
            if (!valid) return;
            submitting.value = true;
            try {
              if (isEdit.value) {
                const res = await axios.patch(`${API_BASE}/user/${currentId.value}`, {
                  name: form.name, age: form.age, sex: form.sex,
                  telephone: form.telephone, email: form.email
                });
                if (unwrap(res, '修改成功') !== null) {
                  dialogVisible.value = false;
                  loadUsers();
                }
              } else {
                const res = await axios.post(`${API_BASE}/user`, { ...form });
                if (unwrap(res, '新增成功') !== null) {
                  dialogVisible.value = false;
                  loadUsers();
                }
              }
            } catch (e) {
              console.error(e);
              ElMessage.error(e.response?.data?.msg || '提交失败');
            } finally {
              submitting.value = false;
            }
          });
        }

        async function handleDelete(row) {
          try {
            await ElMessageBox.confirm(`确认删除「${row.name}」吗？`, '提示', {
              type: 'warning', confirmButtonText: '删除', cancelButtonText: '取消'
            });
          } catch {
            return; // 用户取消
          }
          try {
            const res = await axios.delete(`${API_BASE}/user/${row.id}`);
            if (unwrap(res, '删除成功') !== null) loadUsers();
          } catch (e) {
            console.error(e);
            ElMessage.error(e.response?.data?.msg || '删除失败');
          }
        }

        onMounted(loadUsers);

        return {
          users, keyword, loading, submitting, dialogVisible, isEdit, formRef, form, rules,
          handleSearch, handleReset, handleSubmit, openCreate, openEdit, handleDelete
        };
      }
    })
      .use(ElementPlus, { locale: ElementPlusLocaleZhCn })
      .mount('#app');
  </script>
</body>
</html>
